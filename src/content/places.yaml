- id: canada
  order: 2
  country: Canada
  domain: AI hiring
  projects:
    - who: Driip · Technical lead · 2023 to now
      title: Talentos, AI recruiting agents that wait for a person to say yes
      body: >-
        Talentos screens résumés against a rubric, books interviews and writes candidate email. Its agents
        can draft anything, but every write waits for human approval. It plugs into Lever, Workable and
        Greenhouse. I wrote most of the FastAPI backend and the Next.js frontend.
      figures:
        - { value: "3", label: "AI agents" }
        - { value: "3", label: "ATS integrations" }
        - { value: "56", label: "backend tests" }
    - who: Driip · Technical lead
      title: The hiring platform, from first commit through three pivots
      body: >-
        Proctored assessments with browser lockdown and webcam recording, and an AI interview pipeline that
        writes feedback with no human reviewer. I led a team of three engineers through it.
      figures:
        - { value: "1,000+", label: "candidates assessed" }
        - { value: "2", label: "paying clients" }
        - { value: "805", label: "commits" }

